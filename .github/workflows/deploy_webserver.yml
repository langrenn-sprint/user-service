name: Test, build and deploy webserver
on:
  push:
    branches:
      - main
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE: ghcr.io/langrenn-sprint/user-service

jobs:
  build-and-deploy:
    name: Build, test and publish to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Gives OCI labels (revision, created, source, ...) and the tags
      # `latest` and `sha-<short>` to publish after the tests have passed.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          uv run poe release
        env:
          IMAGE_PREBUILT: "1"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish exactly the image that was tested by re-tagging `:test`.
      - name: Tag and publish docker image to GitHub Container Registry
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |-
          for tag in $TAGS; do
            docker tag "$IMAGE:test" "$tag"
            docker push "$tag"
          done
          docker rmi "$IMAGE:test"
