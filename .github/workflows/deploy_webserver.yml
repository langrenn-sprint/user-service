name: Test, build and deploy webserver

on:
  push:
    branches:
      - main

jobs:
  build-test-publish:
    name: Build, test and publish to GitHub Container Registry
    permissions:
      contents: read
      packages: write
    uses: langrenn-sprint/.github/.github/workflows/build-test-publish.yml@main
    with:
      publish: true
    secrets:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
